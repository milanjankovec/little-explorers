    <title>Grafomotorické cestičky na vytlačenie</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        color: #20252d;
        background: #edf1f6;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .icon-library {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        max-width: 900px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 auto 24px;
      }

      .toolbar h1 {
        margin: 0 0 4px;
        font-size: 1.4rem;
      }

      .toolbar p {
        margin: 0;
        color: #566170;
      }

      .actions {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
      }

      button {
        padding: 11px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #3158a5;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: #244485;
      }

      button.secondary {
        color: #263248;
        background: white;
        box-shadow: inset 0 0 0 1px #cbd3df;
      }

      button.secondary:hover {
        background: #f5f7fa;
      }

      .worksheet {
        width: min(100%, 210mm);
        height: 297mm;
        margin: 0 auto 24px;
        padding: 12mm 12mm;
        background: white;
        box-shadow: 0 2px 18px #1720331a;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .page-header {
        border-bottom: 0.4mm solid #d5dbe4;
        padding-bottom: 2.5mm;
        margin-bottom: 3mm;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .page-header h1 {
        margin: 0;
        font-size: 16pt;
        color: #1e2633;
      }

      .page-header p {
        margin: 1mm 0 0;
        font-size: 9pt;
        color: #5d6878;
      }

      .lanes-container {
        display: flex;
        flex-direction: column;
        gap: 4mm;
        flex: 1;
        justify-content: space-around;
      }

      .lane-card {
        border: 0.35mm solid #cbd3df;
        border-radius: 3mm;
        padding: 3mm 4mm;
        background: #fafbfd;
        display: flex;
        flex-direction: column;
        gap: 2mm;
      }

      .lane-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        column-gap: 2mm;
      }

      .lane-title {
        font-size: 10.5pt;
        font-weight: 700;
        color: #263248;
      }

      .lane-sub {
        font-size: 7.5pt;
        color: #536275;
        text-transform: uppercase;
        font-weight: 600;
      }

      .lane-canvas {
        width: 100%;
        height: 32mm;
        display: block;
      }

      @media screen and (max-width: 650px) {
        body {
          padding: 12px;
        }

        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          width: 100%;
        }

        .actions button {
          flex: 1;
        }

        .worksheet {
          height: auto;
          padding: 6mm;
        }

        .lane-canvas { height: auto; }
      }

      .game-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 11px;
        width: min(100%, 210mm);
        margin-inline: auto;
        padding-block: 9px 5px;
        border-top: 1px solid #cbd3df;
        color: #4c5766;
        font-size: .65rem;
        line-height: 1.5;
      }

      .game-footer a {
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .game-footer a:hover { color: #3158a5; background: none; }

      @page {
        size: A4 portrait;
        margin: 0;
      }

      @media print {
        .lane-card { background-color: white; }
        body {
          padding: 0;
          background: white;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .toolbar, .game-footer {
          display: none;
        }

        .worksheet {
          width: 210mm;
          height: 297mm;
          min-height: 297mm;
          margin: 0;
          padding: 10mm 12mm;
          box-shadow: none;
          page-break-after: avoid;
        }
      }
      .game-topbar {
        max-width: 900px;
        margin: 0 auto 12px;
        color: #394553;
        font: 600 .9rem/1.4 system-ui, sans-serif;
      }

      .game-brand-row, .game-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      .game-brand-row {
        min-height: 56px;
        padding-bottom: 9px;
        border-bottom: 1px solid #cbd9d0;
      }

      .game-links { position: relative; padding-top: 8px; }
      .game-topbar .site-brand, .game-topbar .catalog-link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        max-width: 100%;
        gap: 8px;
        color: #246547;
        text-decoration: none;
      }

      .game-topbar .site-brand { color: #202f26; font-size: 1.06rem; font-weight: 800; }
      .game-topbar .catalog-link { font-weight: 700; overflow-wrap: anywhere; }
      .game-topbar .catalog-link:hover, .game-topbar .site-brand:hover { text-decoration: underline; text-underline-offset: .2em; }
      .catalog-link svg { flex: none; }
      .game-brand-icon {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #dceedd;
        color: #236747;
        font-size: 1.25rem;
        line-height: 1;
      }

      .language-bar[hidden], .games-menu[hidden] { display: none; }
      .language-bar { margin-inline-start: auto; }
      .language-control { display: flex; align-items: center; gap: 7px; }
      .language-control select {
        max-width: min(145px, 42vw);
        padding: 5px 6px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .game-topbar :is(a, summary, select):focus-visible {
        outline: 2px solid #246547;
        outline-offset: 2px;
      }

      .games-menu { max-width: 100%; margin-inline-start: auto; }
      .games-menu summary {
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .games-menu-panel {
        position: absolute;
        z-index: 10;
        top: calc(100% + 6px);
        inset-inline-end: 0;
        width: min(480px, 100%);
        max-height: min(58vh, 470px);
        overflow: auto;
        padding: 8px;
        border: 1px solid #cbd3df;
        border-radius: 9px;
        background: #fff;
        box-shadow: 0 6px 22px #17203324;
      }

      .games-menu-panel ul {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .games-menu-panel a {
        display: block;
        padding: 5px 7px;
        border-radius: 5px;
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .games-menu-panel a:hover, .games-menu-panel a[aria-current="page"] { background: #e7f2e8; }

      @media screen and (max-width: 430px) {
        .games-menu-panel ul { grid-template-columns: 1fr; }
      }

      @media print { .game-topbar { display: none; } }
    </style>

        <p>Precvičovanie jemnej motoriky a koordinácie ruka-oko pre deti 3–5 rokov.</p>
      </div>
      <div class="actions">
        <button class="secondary" type="button" onclick="generateWorksheet()">Nové dráhy</button>
        <button type="button" onclick="window.print()">Vytlačiť list</button>
      </div>
    </header>

    <main id="app">
      <section class="worksheet">
        <div class="page-header">
          <div>
            <h1>Doveď zvieratká do cieľa</h1>
            <p>Obťahuj ceruzkou prerušovanú čiaru vo vnútri cestičky zľava doprava.</p>
          </div>
        </div>

        <div class="lanes-container" id="lanes"></div>
      </section>
    </main>
    <footer class="game-footer">
      <span>© 2026 Milan Jankovec</span>
      <a href="https://github.com/milanjankovec/little-explorers">GitHub</a>
      <a href="../../LICENSE">EUPL-1.2</a>
    </footer>

    <script>
      const pairs = [
        { title: "Zajačik skáče k mrkvičke", start: "rabbit", goal: "carrot" },
        { title: "Včielka letí ku kvetinke", start: "bee", goal: "flower" },
        { title: "Mačička kráča za rybkou", start: "cat", goal: "fish" },
        { title: "Psík uteká za kostičkou", start: "dog", goal: "bone" },
        { title: "Myška trieli za syrom", start: "mouse", goal: "cheese" },
        { title: "Žabka skáče na lekno", start: "frog", goal: "lilypad" },
        { title: "Ježko kráča k jabĺčku", start: "hedgehog", goal: "apple" },
        { title: "Veverička beží k žaluďu", start: "squirrel", goal: "acorn" },
        { title: "Vtáčik letí do hniezda", start: "bird", goal: "nest" }
      ];

      const smoothPaths = [
        { type: "wave", name: "Vlnky" },
        { type: "arches", name: "Oblúčiky" },
        { type: "s-bends", name: "Esíčka" }
      ];
      const angularPaths = [
        { type: "zigzag", name: "Zúbky" },
        { type: "steps", name: "Schodíky" },
        { type: "ramps", name: "Šikmé plošinky" }
      ];

      function randomInt(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      function shuffle(items) {
        const copy = items.slice();
        for (let index = copy.length - 1; index > 0; index--) {
          const other = randomInt(0, index);
          [copy[index], copy[other]] = [copy[other], copy[index]];
        }
        return copy;
      }

      function generatePath(type, width, height) {
        const startX = 60;
        const endX = width - 60;
        const midY = height / 2;
        const weights = Array.from({ length: randomInt(3, 6) }, () => randomInt(82, 118));
        const weightTotal = weights.reduce((total, weight) => total + weight, 0);
        const firstSign = Math.random() < 0.5 ? -1 : 1;
        let travelled = 0;
        let d = `M ${startX} ${midY}`;

        weights.forEach((weight, index) => {
          const x = fraction => Math.round(startX + (endX - startX) * (travelled + weight * fraction) / weightTotal);
          const sign = index % 2 === 0 ? firstSign : -firstSign;
          const amplitude = randomInt(17, 24);
          const peakY = midY + amplitude * sign;

          if (type === "wave") {
            d += ` Q ${x(0.5)} ${peakY} ${x(1)} ${midY}`;
          } else if (type === "arches") {
            d += ` Q ${x(0.5)} ${midY + amplitude * firstSign} ${x(1)} ${midY}`;
          } else if (type === "s-bends") {
            d += ` C ${x(0.25)} ${peakY} ${x(0.75)} ${midY - amplitude * sign} ${x(1)} ${midY}`;
          } else if (type === "zigzag") {
            d += ` L ${x(randomInt(40, 60) / 100)} ${peakY} L ${x(1)} ${midY}`;
          } else if (type === "steps") {
            d += ` H ${x(0.26)} V ${peakY} H ${x(0.76)} V ${midY} H ${x(1)}`;
          } else {
            d += ` L ${x(0.28)} ${peakY} H ${x(0.7)} L ${x(1)} ${midY}`;
          }
          travelled += weight;
        });
        return d;
      }

      function generateWorksheet() {
        const selectedPairs = shuffle(pairs).slice(0, 4);
        const profiles = [...shuffle(smoothPaths).slice(0, 2), ...shuffle(angularPaths).slice(0, 2)];

        const container = document.querySelector("#lanes");
        container.innerHTML = "";

        selectedPairs.forEach((pair, index) => {
          const profile = profiles[index];
          const svgW = 600;
          const svgH = 80;
          const pathD = generatePath(profile.type, svgW, svgH);

          const card = document.createElement("article");
          card.className = "lane-card";
          card.innerHTML = `
            <div class="lane-info">
              <span class="lane-title">${index + 1}. ${pair.title}</span>
              <span class="lane-sub">${profile.name}</span>
            </div>
            <svg class="lane-canvas" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="${pair.title}">
              <!-- Wide corridor track for crayons -->
              <path d="${pathD}" fill="none" stroke="#e8f0fe" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="${pathD}" fill="none" stroke="#cbdcf7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
              
              <!-- Dashed guiding center line -->
              <path d="${pathD}" fill="none" stroke="#5a739c" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
              
              <!-- Direction arrow cues along start -->
              <circle cx="60" cy="${svgH / 2}" r="4" fill="#3158a5"/>
              <circle cx="${svgW - 60}" cy="${svgH / 2}" r="4" fill="#2ea043"/>
              
              <!-- Start icon -->
              <svg x="5" y="${svgH / 2 - 24}" width="48" height="48" viewBox="0 0 64 64">
                <use href="#icon-${pair.start}"/>
              </svg>
              <!-- Goal icon -->
              <svg x="${svgW - 53}" y="${svgH / 2 - 24}" width="48" height="48" viewBox="0 0 64 64">
                <use href="#icon-${pair.goal}"/>
              </svg>
            </svg>
          `;
          container.appendChild(card);
        });
      }

      generateWorksheet();
    </script>
  </body>
</html>
