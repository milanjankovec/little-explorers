 och ringa in bilden som passar till ordet du hör.","请大人每行只读印出来的那个词。仔细听，然后圈出和听到的词相配的图。","請大人每行只讀印出來的那個詞。仔細聽，然後圈出和聽到的詞相配的圖。","一だんずつ、書いてあることばだけを大人に読んでもらおう。よく聞いて、そのことばに合う絵に丸をつけてね。","각 줄에 쓰인 낱말만 어른에게 읽어 달라고 해요. 잘 듣고 들은 낱말에 맞는 그림에 동그라미를 그려요.","Minta orang dewasa membacakan hanya kata yang tertulis di tiap baris. Dengarkan baik-baik, lalu lingkari gambar yang sesuai.","Bir yetişkinden her sırada yalnızca yazılı sözcüğü okumasını iste. Dikkatle dinle ve duyduğun sözcüğe uyan resmi yuvarlak içine al.","Nhờ người lớn chỉ đọc từ được in trong mỗi hàng. Lắng nghe kỹ rồi khoanh tròn hình tương ứng với từ em nghe được.","Peça para um adulto ler só a palavra impressa em cada linha. Escute com atenção e circule a figura que combina com a palavra ouvida."]

o","Esercizio","Exercício","Opdracht","Exercițiu","Завдання","Άσκηση","Uppgift","任务","任務","問題","문제","Tugas","Görev","Nhiệm vụ","Exercício"],"Výber":["Choices","Výběr","Auswahl","Wybór","Választék","Choix","Opciones","Opzioni","Opções","Keuzes","Opțiuni","Варіанти","Επιλογές","Alternativ","选项","選項","選択肢","보기","Pilihan","Seçenekler","Các lựa chọn","Opções"],"Koľko?":["How many?","Kolik?","Wie viele?","Ile?","Hány?","Combien ?","¿Cuántos?","Quanti?","Quantos?","Hoeveel?","Câte?","Скільки?","Πόσα;","Hur många?","有多少？","有多少？","いくつ？","몇 개일까요?","Berapa banyak?","Kaç tane?","Có bao nhiêu?","Quantos?"],"Nové úlohy":["New activities","Nové úkoly","Neue Aufgaben","Nowe zadania","Új feladatok","Nouveaux exercices","Nuevos ejercicios","Nuovi esercizi","Novos exercícios","Nieuwe opdrachten","Exerciții noi","Нові завдання","Νέες ασκήσεις","Nya uppgifter","换一组题目","換一組題目","新しい問題","새 문제","Aktivitas baru","Yeni etkinlikler","Bài tập mới","Novos exercícios"],"Nové obrázky":["New pictures","Nové obrázky","Neue Bilder","Nowe obrazki","Új képek","Nouvelles images","Nuevas imágenes","Nuove immagini","Novas imagens","Nieuwe afbeeldingen","Imagini noi","Нові малюнки","Νέες εικόνες","Nya bilder","换一组图片","換一組圖片","新しい絵","새 그림","Gambar baru","Yeni resimler","Hình mới","Novas imagens"],"Späť na hry":["Back to games","Zpět ke hrám","Zurück zu den Spielen","Wróć do gier","Vissza a játékokhoz","Retour aux jeux","Volver a los juegos","Torna ai giochi","Voltar aos jogos","Terug naar de spellen","Înapoi la jocuri","Назад до ігор","Πίσω στα παιχνίδια","Tillbaka till spelen","返回游戏列表","返回遊戲列表","ゲーム一覧へ戻る","게임 목록으로 돌아가기","Kembali ke daftar permainan","Oyunlara dön","Quay lại danh sách trò chơi","Voltar aos jogos"],"Pracovný list":["Worksheet","Pracovní list","Arbeitsblatt","Karta pracy","Feladatlap","Fiche d’activité","Ficha de actividades","Scheda di attività","Ficha de atividades","Werkblad","Fișă de lucru","Робочий аркуш","Φύλλο εργασίας","Arbetsblad","练习单","學習單","ワークシート","활동지","Lembar aktivitas","Çalışma sayfası","Phiếu bài tập","Folha de atividade"]};
        const messages = JSON.parse(document.getElementById("game-translations").textContent);
        const preferenceKey = "hrave-listy-language";
        const current = new URL(location.href);
        const resolveLanguage = code => Object.keys(languages).find(key => key.toLowerCase() === code?.toLowerCase());
        let saved;
        try { saved = localStorage.getItem(preferenceKey); } catch {}
        const requested = resolveLanguage(current.searchParams.get("lang"));
        const language = requested ?? resolveLanguage(saved) ?? "en";
        const column = codes.indexOf(language);

        function remember(code) {
          try { localStorage.setItem(preferenceKey, code); } catch {}
        }

        function localizedUrl(href, code) {
          const url = new URL(href, location.href);
          url.searchParams.set("lang", code);
          return url;
        }

        function translate(value) {
          if (language === "sk" || !value) return value;
          const key = value.trim().replace(/\s+/g, " ");
          const exact = (messages[key] ?? shared[key])?.[column];
          if (exact !== undefined) return exact;
          const numbered = key.match(/^(\d+\.\s+)(.+)$/u);
          if (numbered) return numbered[1] + translate(numbered[2]);
          const colon = key.indexOf(":");
          if (colon > 0) {
            const label = key.slice(0, colon);
            const tail = key.slice(colon + 1).trim();
            const translatedLabel = translate(label);
            const translatedTail = translate(tail);
            if (label !== translatedLabel || tail !== translatedTail) {
              return translatedLabel + ":" + (tail ? " " + translatedTail : "");
            }
          }
          if (key.includes(" | ")) return key.split(" | ").map(translate).join(" | ");
          if (key.includes(", ")) {
            const parts = key.split(", ");
            const translated = parts.map(translate).join(", ");
            if (translated !== key) return translated;
          }
          return value;
        }

        window.HraveListy = { language, t: translate };
        document.documentElement.lang = language;
        if (requested) remember(language);

        const visitedText = new WeakSet();
        const visitedElements = new WeakSet();
        const skipped = "script, style, [data-no-l10n]";

        function translateText(node) {
          if (visitedText.has(node) || node.parentElement?.closest(skipped)) return;
          visitedText.add(node);
          const content = node.data.trim();
          const translated = translate(content);
          if (content !== translated) node.data = node.data.replace(content, translated);
        }

        function translateAttributes(element) {
          if (visitedElements.has(element) || element.closest(skipped)) return;
          visitedElements.add(element);
          for (const attribute of ["aria-label", "title", "placeholder"]) {
            const value = element.getAttribute(attribute);
            if (value) element.setAttribute(attribute, translate(value));
          }
        }

        function translateTree(root) {
          if (root.nodeType === Node.TEXT_NODE) {
            translateText(root);
            return;
          }
          if (root.nodeType !== Node.ELEMENT_NODE || root.closest(skipped)) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          while (walker.nextNode()) translateText(walker.currentNode);
          translateAttributes(root);
          root.querySelectorAll("[aria-label], [title], [placeholder]").forEach(translateAttributes);
        }

        document.addEventListener("DOMContentLoaded", () => {
          const picker = document.getElementById("worksheet-language");
          for (const [code, name] of Object.entries(languages)) {
            const option = new Option(name, code);
            option.lang = code;
            option.setAttribute("data-no-l10n", "");
            picker.add(option);
          }
          picker.value = language;
          const menu = document.getElementById("related-games");
          if (menu) {

      function shuffleSoundPictures(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const other = Math.floor(Math.random() * (index + 1));
          [result[index], result[other]] = [result[other], result[index]];
        }
        return result;
      }

      function soundChoice(icon, index) {
        return `
              <g transform="translate(${80 + index * 281} 36)" data-sound-choice="${icon}">
                <rect width="258" height="116" rx="14" fill="#fff" stroke="#bcaec5" stroke-width="1.7"/>
                <svg x="84" y="9" width="94" height="94" viewBox="0 0 64 64"><use href="#icon-${icon}"/></svg>
                <circle cx="232" cy="90" r="12" fill="#fff" stroke="#7c6088" stroke-width="2"/>
              </g>`;
      }

      function generateWorksheet() {
        const pairs = soundPairs[window.HraveListy.language];
        const rows = shuffleSoundPictures(pairs).slice(0, 5).map((pair, index) => {
          const options = shuffleSoundPictures(pair);
          const [answerIcon, word] = pair[Math.floor(Math.random() * pair.length)];
          return `
            <g transform="translate(0 ${11 + index * 167})" data-sound-row="${index + 1}" data-sound-answer="${answerIcon}">
              <rect x="11" width="678" height="157" rx="15" fill="#fff" stroke="#beb1c7" stroke-width="1.5"/>
              <text x="26" y="25" font-size="23" font-weight="700" fill="#59435f" data-sound-cue data-no-l10n>${index + 1}. ${word}</text>
              ${options.map(([icon], choice) => soundChoice(icon, choice)).join("")}
            </g>`;
        });
        document.getElementById("worksheet-content").innerHTML = `
          <svg class="activity-drawing" viewBox="0 0 700 850" aria-hidden="true">${rows.join("")}</svg>`;
      }

      generateWorksheet();
