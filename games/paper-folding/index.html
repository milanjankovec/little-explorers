    {
      "Skladaj podľa záhybov": ["Fold along the Lines","Skládej podle ohybů","Falten entlang der Linien","Składaj wzdłuż linii","Hajtogass a vonalak mentén","Plie le long des lignes","Dobla por las líneas","Piega lungo le linee","Dobra pelas linhas","Vouw langs de lijnen","Îndoaie pe linii","Згинай за лініями","Δίπλωσε στις γραμμές","Vik längs linjerna","沿线折纸","沿線摺紙","線にそっておろう","접는 선을 따라 접어요","Lipat Mengikuti Garis","Çizgilerden Katla","Gấp theo nếp","Dobre pelas linhas"],

      "Otoč špicom nadol a prelož rohy po krátkych čiarach.": ["Point the triangle down and fold the corners on the short lines.","Otoč špičkou dolů a přelož rohy po krátkých čarách.","Dreh die Spitze nach unten und falte die Ecken an den kurzen Linien.","Obróć czubkiem w dół i zagnij rogi na krótkich liniach.","Fordítsd a csúcsot lefelé, és hajtsd be a sarkokat a rövid vonalakon.","Tourne la pointe vers le bas et plie les coins sur les traits courts.","Gira la punta hacia abajo y dobla las esquinas por las líneas cortas.","Gira la punta verso il basso e piega gli angoli sulle linee corte.","Vira a ponta para baixo e dobra os cantos pelas linhas curtas.","Draai de punt naar beneden en vouw de hoeken langs de korte lijnen.","Rotește vârful în jos și îndoaie colțurile pe liniile scurte.","Поверни вістрям донизу і загни кути по коротких лініях.","Γύρισε τη μύτη προς τα κάτω και δίπλωσε τις γωνίες στις κοντές γραμμές.","Vänd spetsen nedåt och vik hörnen vid de korta linjerna.","让尖角朝下，沿短线折两个角。","讓尖角朝下，沿短線摺兩個角。","とがった先を下にして、二つの角を短い線でおろう。","뾰족한 끝을 아래로 향하게 하고 짧은 선을 따라 모서리를 접어요.","Arahkan ujungnya ke bawah dan lipat sudut pada garis pendek.","Ucu aşağı çevir ve köşeleri kısa çizgilerden katla.","Quay đầu nhọn xuống và gấp các góc theo đường ngắn.","Vire a ponta para baixo e dobre os cantos nas linhas curtas."],
      "Dokresli oči, ňufák a škvrnky.": ["Draw eyes, a nose and spots.","Dokresli oči, čumák a skvrnky.","Male Augen, Nase und Flecken.","Dorysuj oczy, nosek i łatki.","Rajzolj rá szemeket, orrot és foltokat.","Dessine les yeux, la truffe et les taches.","Dibuja los ojos, el hocico y las manchas.","Disegna gli occhi, il muso e le macchie.","Desenha os olhos, o focinho e as manchas.","Teken ogen, een neus en vlekken.","Desenează ochii, botul și petele.","Домалюй очі, носик і плямки.","Ζωγράφισε μάτια, μυτούλα και βούλες.","Rita ögon, nos och fläckar.","画上眼睛、鼻子和斑点。","畫上眼睛、鼻子和斑點。","目、鼻、もようをかこう。","눈, 코, 얼룩무늬를 그려요.","Gambar mata, hidung, dan bintik-bintik.","Gözlerini, burnunu ve beneklerini çiz.","Vẽ thêm mắt, mũi và các đốm.","Desenhe os olhos, o focinho e as manchas."],
      "Vystrihni štvorec po tmavej prerušovanej čiare. Skladaj po modrých čiarach podľa troch obrázkov.": ["Cut out the square along the dark dashed line. Fold along the blue lines and follow the three pictures.","Vystřihni čtverec po tmavé přerušované čáře. Překládej po modrých čarách podle tří obrázků.","Schneide das Quadrat an der dunklen gestrichelten Linie aus. Falte entlang der blauen Linien und folge den drei Bildern.","Wytnij kwadrat wzdłuż ciemnej przerywanej linii. Zaginaj wzdłuż niebieskich linii, patrząc na trzy obrazki.","Vágd ki a négyzetet a sötét szaggatott vonal mentén. Hajtsd be a kék vonalaknál a három kép szerint.","Découpe le carré le long des pointillés foncés. Plie le long des lignes bleues en suivant les trois images.","Recorta el cuadrado por la línea oscura discontinua. Dobla por las líneas azules siguiendo los tres dibujos.","Ritaglia il quadrato lungo la linea scura tratteggiata. Piega lungo le linee blu seguendo le tre immagini.","Recorta o quadrado pela linha escura tracejada. Dobra pelas linhas azuis seguindo as três imagens.","Knip het vierkant uit langs de donkere stippellijn. Vouw langs de blauwe lijnen zoals op de drie plaatjes.","Decupează pătratul pe linia punctată închisă la culoare. Îndoaie pe liniile albastre urmând cele trei imagini.","Виріж квадрат по темній пунктирній лінії. Складай по синіх лініях за трьома малюнками.","Κόψε το τετράγωνο στη σκούρα διακεκομμένη γραμμή. Δίπλωσε στις μπλε γραμμές σύμφωνα με τις τρεις εικόνες.","Klipp ut kvadraten längs den mörka streckade linjen. Vik längs de blå linjerna och följ de tre bilderna.","沿深色虚线剪下正方形。按照三张图，沿蓝线折纸。","沿深色虛線剪下正方形。按照三張圖，沿藍線摺紙。","黒っぽい点線にそって四角を切り取ろう。三つの絵を見ながら青い線にそっておってね。","어두운 점선을 따라 정사각형을 오려요. 그림 세 개를 보면서 파란 선을 따라 접어요.","Gunting persegi mengikuti garis putus-putus gelap. Lipat mengikuti garis biru sesuai ketiga gambar.","Kareyi koyu renkli kesik çizgiden kes. Üç resme bakarak mavi çizgilerden katla.","Cắt hình vuông theo đường nét đứt màu đậm. Gấp theo các đường màu xanh, làm theo ba hình hướng dẫn.","Recorte o quadrado pela linha escura tracejada. Dobre pelas linhas azuis seguindo as três figuras."]
    }

    <script>

        const codes = Object.keys(languages).slice(1);
        const shared = {"Jazyk":["Language","Jazyk","Sprache","Język","Nyelv","Langue","Idioma","Lingua","Idioma","Taal","Limbă","Мова","Γλώσσα","Språk","语言","語言","言語","언어","Bahasa","Dil","Ngôn ngữ","Idioma"],"Všetky hry":["All games","Všechny hry","Alle Spiele","Wszystkie gry","Minden játék","Tous les jeux","Todos los juegos","Tutti i giochi","Todos os jogos","Alle spellen","Toate jocurile","Усі ігри","Όλα τα παιχνίδια","Alla spel","全部游戏","全部遊戲","すべてのゲーム","모든 놀이","Semua permainan","Tüm oyunlar","Tất cả trò chơi","Todos os jogos"],"Vytlačiť list":["Print worksheet","Vytisknout list","Arbeitsblatt drucken","Drukuj kartę","Feladatlap nyomtatása","Imprimer la fiche","Imprimir la ficha","Stampa la scheda","Imprimir a ficha","Werkblad afdrukken","Tipărește fișa","Друк завдання","Εκτύπωση φύλλου","Skriv ut arbetsblad","打印练习单","列印學習單","ワークシートを印刷","활동지 인쇄","Cetak lembar aktivitas","Çalışma sayfasını yazdır","In phiếu bài tập","Imprimir atividade"],"Vytlačiť hry":["Print games","Vytisknout hry","Spiele drucken","Drukuj gry","Játékok nyomtatása","Imprimer les jeux","Imprimir los juegos","Stampa i giochi","Imprimir os jogos","Spellen afdrukken","Tipărește jocurile","Друк ігор","Εκτύπωση παιχνιδιών","Skriv ut spelen","打印游戏","列印遊戲","ゲームを印刷","놀이 인쇄","Cetak permainan","Oyunları yazdır","In trò chơi","Imprimir os jogos"],"Vytvoril Milan Jankovec":["Created by Milan Jankovec","Vytvořil Milan Jankovec","Erstellt von Milan Jankovec","Autor: Milan Jankovec","Készítette: Milan Jankovec","Créé par Milan Jankovec","Creado por Milan Jankovec","Creato da Milan Jankovec","Criado por Milan Jankovec","Gemaakt door Milan Jankovec","Creat de Milan Jankovec","Автор: Milan Jankovec","Δημιουργός: Milan Jankovec","Skapat av Milan Jankovec","作者：Milan Jankovec","作者：Milan Jankovec","制作 Milan Jankovec","제작 Milan Jankovec","Dibuat oleh Milan Jankovec","Hazırlayan Milan Jankovec","Tác giả Milan Jankovec","Criado por Milan Jankovec"],"Úloha":["Task","Úkol","Aufgabe","Zadanie","Feladat","Exercice","Ejercicio","Esercizio","Exercício","Opdracht","Exercițiu","Завдання","Άσκηση","Uppgift","任务","任務","問題","문제","Tugas","Görev","Nhiệm vụ","Exercício"],"Výber":["Choices","Výběr","Auswahl","Wybór","Választék","Choix","Opciones","Opzioni","Opções","Keuzes","Opțiuni","Варіанти","Επιλογές","Alternativ","选项","選項","選択肢","보기","Pilihan","Seçenekler","Các lựa chọn","Opções"],"Koľko?":["How many?","Kolik?","Wie viele?","Ile?","Hány?","Combien ?","¿Cuántos?","Quanti?","Quantos?","Hoeveel?","Câte?","Скільки?","Πόσα;","Hur många?","有多少？","有多少？","いくつ？","몇 개일까요?","Berapa banyak?","Kaç tane?","Có bao nhiêu?","Quantos?"],"Nové úlohy":["New activities","Nové úkoly","Neue Aufgaben","Nowe zadania","Új feladatok","Nouveaux exercices","Nuevos ejercicios","Nuovi esercizi","Novos exercícios","Nieuwe opdrachten","Exerciții noi","Нові завдання","Νέες ασκήσεις","Nya uppgifter","换一组题目","換一組題目","新しい問題","새 문제","Aktivitas baru","Yeni etkinlikler","Bài tập mới","Novos exercícios"],"Nové obrázky":["New pictures","Nové obrázky","Neue Bilder","Nowe obrazki","Új képek","Nouvelles images","Nuevas imágenes","Nuove immagini","Novas imagens","Nieuwe afbeeldingen","Imagini noi","Нові малюнки","Νέες εικόνες","Nya bilder","换一组图片","換一組圖片","新しい絵","새 그림","Gambar baru","Yeni resimler","Hình mới","Novas imagens"],"Späť na hry":["Back to games","Zpět ke hrám","Zurück zu den Spielen","Wróć do gier","Vissza a játékokhoz","Retour aux jeux","Volver a los juegos","Torna ai giochi","Voltar aos jogos","Terug naar de spellen","Înapoi la jocuri","Назад до ігор","Πίσω στα παιχνίδια","Tillbaka till spelen","返回游戏列表","返回遊戲列表","ゲーム一覧へ戻る","게임 목록으로 돌아가기","Kembali ke daftar permainan","Oyunlara dön","Quay lại danh sách trò chơi","Voltar aos jogos"],"Pracovný list":["Worksheet","Pracovní list","Arbeitsblatt","Karta pracy","Feladatlap","Fiche d’activité","Ficha de actividades","Scheda di attività","Ficha de atividades","Werkblad","Fișă de lucru","Робочий аркуш","Φύλλο εργασίας","Arbetsblad","练习单","學習單","ワークシート","활동지","Lembar aktivitas","Çalışma sayfası","Phiếu bài tập","Folha de atividade"]};
        const messages = JSON.parse(document.getElementById("game-translations").textContent);
        const preferenceKey = "hrave-listy-language";
        const current = new URL(location.href);
        const resolveLanguage = code => Object.keys(languages).find(key => key.toLowerCase() === code?.toLowerCase());
        let saved;
        try { saved = localStorage.getItem(preferenceKey); } catch {}
        const requested = resolveLanguage(current.searchParams.get("lang"));
        const language = requested ?? resolveLanguage(saved) ?? "en";
        const column = codes.indexOf(language);

        function remember(code) {
          try { localStorage.setItem(preferenceKey, code); } catch {}
        }

        function localizedUrl(href, code) {
          const url = new URL(href, location.href);
          url.searchParams.set("lang", code);
          return url;
        }

        function translate(value) {
          if (language === "sk" || !value) return value;
          const key = value.trim().replace(/\s+/g, " ");
          const exact = (messages[key] ?? shared[key])?.[column];
          if (exact !== undefined) return exact;
          const numbered = key.match(/^(\d+\.\s+)(.+)$/u);
          if (numbered) return numbered[1] + translate(numbered[2]);
          const colon = key.indexOf(":");
          if (colon > 0) {
            const label = key.slice(0, colon);
            const tail = key.slice(colon + 1).trim();
            const translatedLabel = translate(label);
            const translatedTail = translate(tail);
            if (label !== translatedLabel || tail !== translatedTail) {
              return translatedLabel + ":" + (tail ? " " + translatedTail : "");

              const item = document.createElement("li");
              const link = document.createElement("a");
              const url = localizedUrl(new URL(game.path, catalog), language);
              link.href = url.href;
              link.textContent = language === "sk" ? game.title : game.names[column];
              link.setAttribute("data-no-l10n", "");

            menu.closest("details").hidden = false;
          }
          picker.closest(".language-bar").hidden = false;
          picker.addEventListener("change", () => {
            const chosen = picker.value;
            if (Object.hasOwn(languages, chosen) && chosen !== language) {
              remember(chosen);
              location.replace(localizedUrl(location.href, chosen).href);
            }
          });
          document.querySelectorAll("a.game[href], a.catalog-link[href], a.site-brand[href]").forEach(link => {
            link.href = localizedUrl(link.href, language).href;
          });
          if (language === "sk") return;
          document.title = translate(document.title);
          const meta = document.querySelector('meta[name="description"]');
          if (meta) meta.content = translate(meta.content);
          translateTree(document.body);
          const observer = new MutationObserver(records => {
            for (const record of records) record.addedNodes.forEach(translateTree);
          });
          observer.observe(document.body, { childList: true, subtree: true });
          window.addEventListener("beforeprint", () => translateTree(document.body));
        });
      })();

    <header class="game-topbar">
      <div class="game-brand-row">

      <nav class="game-links" aria-label="Všetky hry">

    <header class="toolbar">
      <h1>Skladaj podľa záhybov</h1>
      <div class="actions">
        <button class="secondary" type="button" onclick="generateWorksheet()">Nové úlohy</button>
        <button type="button" onclick="window.print()">Vytlačiť list</button>
      </div>
    </header>
    <main>
      <section class="worksheet" aria-labelledby="worksheet-title">
        <header class="page-header">
          <h2 id="worksheet-title">Skladaj podľa záhybov</h2>
          <p>Vystrihni štvorec po tmavej prerušovanej čiare. Skladaj po modrých čiarach podľa troch obrázkov.</p>
        </header>
        <div id="worksheet-content"></div>
      </section>
    </main>
    <footer class="game-footer">
      <span>© 2026 Milan Jankovec</span>
      <a href="https://github.com/milanjankovec/little-explorers">GitHub</a>
      <a href="../../LICENSE">EUPL-1.2</a>
    </footer>

    <script>
      const foldingSteps = [
        "Prelož štvorec po uhlopriečke.",
        "Otoč špicom nadol a prelož rohy po krátkych čiarach.",
        "Dokresli oči, ňufák a škvrnky."
      ];
      const triangle = { left: [-80, -42], right: [80, -42], tip: [0, 38] };
      const leftEar = { from: [-31, -42], to: [-68, -30], tip: triangle.left };
      const rightEar = { from: [31, -42], to: [68, -30], tip: triangle.right };
      const decoration = [
        { accent: "#e4ad84", details: '<ellipse cx="-18" cy="-8" rx="13" ry="10" fill="#e4ad84" stroke="none"/>' },
        { accent: "#b59277", details: '<circle cx="15" cy="-12" r="8" fill="#dfbd96" stroke="none"/><circle cx="22" cy="-21" r="4" fill="#dfbd96" stroke="none"/>' },
        { accent: "#d69e94", details: '<ellipse cx="-24" cy="0" rx="6" ry="4" fill="#f6bdb5" stroke="none"/><ellipse cx="24" cy="0" rx="6" ry="4" fill="#f6bdb5" stroke="none"/>' }
      ];

      function printableText(text) {
        return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      }

      function point([x, y]) {
        return `${Number(x.toFixed(3))},${Number(y.toFixed(3))}`;
      }

      function reflectedTip({ from: [ax, ay], to: [bx, by], tip: [tx, ty] }) {
        const dx = bx - ax;
        const dy = by - ay;
        const scale = ((tx - ax) * dx + (ty - ay) * dy) / (dx * dx + dy * dy);
        return [2 * (ax + dx * scale) - tx, 2 * (ay + dy * scale) - ty];
      }

      // The folded triangle is a right isosceles half of the square, with its hypotenuse facing up.
      function squareGuide([x, y], side, mirror) {
        const alongDiagonal = (x + 80) / 160;
        const distanceFromDiagonal = (y + 42) / 160;
        const east = (alongDiagonal + distanceFromDiagonal) * side;
        const south = (alongDiagonal - distanceFromDiagonal) * side;
        return mirror ? [south, east] : [east, south];
      }

      function foldLine(from, to, dash = "8 5") {
        return `<path d="M${point(from)}L${point(to)}" fill="none" stroke="#407fa8" stroke-width="2.6" stroke-dasharray="${dash}" stroke-linecap="round"/>`;
      }

      function stepOne() {
        return `
          <rect x="-45" y="-43" width="92" height="92" fill="#fffbe9" stroke="#40574b" stroke-width="2.6"/>
          <path d="M-45-43H47V49Z" fill="#f2d9a3"/>
          ${foldLine([-45, -43], [47, 49], "6 4")}
          <path d="M-32 24Q-25-10 15-24m-10-2 12 1-6 10" fill="none" stroke="#40574b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        `;
      }

      function stepTwo() {
        const points = [triangle.left, triangle.right, triangle.tip].map(point).join(" ");
        return `
          <polygon points="${points}" fill="#f8e7b9" stroke="#40574b" stroke-width="2.6" stroke-linejoin="round"/>
          ${foldLine(leftEar.from, leftEar.to, "5 4")}
          ${foldLine(rightEar.from, rightEar.to, "5 4")}
          <path d="M-82 -29q-6 9 6 15m-1-7 3 7-8 2m164-17q6 9-6 15m1-7-3 7 8 2"
            fill="none" stroke="#40574b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        `;
      }

      function stepThree({ accent, details }) {
        const front = [leftEar.from, rightEar.from, rightEar.to, triangle.tip, leftEar.to].map(point).join(" ");
        const ears = [leftEar, rightEar].map(ear => {
          const flap = [ear.from, ear.to, reflectedTip(ear)].map(point).join(" ");
          return `<polygon points="${flap}" fill="${accent}" stroke="#40574b" stroke-width="2.7" stroke-linejoin="round"/>`;
        }).join("");
        return `
          <polygon points="${front}" fill="#f8e7b9" stroke="#40574b" stroke-width="2.6" stroke-linejoin="round"/>
          ${ears}
          ${details}
          <circle cx="-15" cy="-9" r="3.1" fill="#35463a"/>
          <circle cx="15" cy="-9" r="3.1" fill="#35463a"/>
          <path d="M-7 12H7L0 22Z" fill="#35463a" stroke-linejoin="round"/>
          <path d="M0 21v3q-5 7-10 1m10-1q5 7 10 1" fill="none" stroke="#35463a" stroke-width="1.8" stroke-linecap="round"/>
        `;
      }

      function numberedDiagram(number, artwork) {
        return `<g data-fold-diagram="${number}" transform="translate(${12 + (number - 1) * 228} 14)">
          <rect width="219" height="151" rx="18" fill="#fff" stroke="#bac8bd" stroke-width="1.7"/>
          <circle cx="24" cy="24" r="13" fill="#d9edda"/>
          <text x="24" y="31" text-anchor="middle" font-size="20" font-weight="750" fill="#284936">${number}</text>
          <g transform="translate(111 88)">${artwork}</g>
        </g>`;
      }

      function stepCaption(source, index) {
        const label = window.HraveListy?.t(source) ?? source;
        const y = 206 + index * 39;
        const fontSize = Math.min(22, 1040 / Array.from(label).length);
        return `
          <g data-fold-caption="${index + 1}">
            <circle cx="39" cy="${y - 7}" r="12" fill="#d9edda"/>
            <text x="39" y="${y}" text-anchor="middle" font-size="17" font-weight="750" fill="#284936">${index + 1}</text>
            <text x="60" y="${y}" font-size="${fontSize}" font-weight="650" fill="#293b31">${printableText(label)}</text>
          </g>`;
      }

      function cutSquare() {
        const side = 460;
        const earGuides = [leftEar, rightEar].flatMap(ear =>
          [false, true].map(mirror => foldLine(squareGuide(ear.from, side, mirror), squareGuide(ear.to, side, mirror), "6 5"))
        ).join("");
        return `
          <g transform="translate(120 342)">
            <rect data-fold-square="true" width="${side}" height="${side}" fill="#fff" stroke="#37473e" stroke-width="2.9" stroke-dasharray="11 6"/>
            ${foldLine([0, 0], [side, side])}
            ${earGuides}
            <g transform="translate(-26 7) rotate(35)" fill="none" stroke="#40574b" stroke-width="2.7" stroke-linecap="round">
              <circle cx="-10" cy="-6" r="4.5"/><circle cx="-10" cy="6" r="4.5"/>
              <path d="M-6-5 13 7M-6 5 13-7"/>
            </g>
          </g>`;
      }

      let previousDecoration = -1;

      function generateWorksheet() {
        const next = previousDecoration === -1
          ? Math.floor(Math.random() * decoration.length)
          : (previousDecoration + 1 + Math.floor(Math.random() * (decoration.length - 1))) % decoration.length;
        previousDecoration = next;
        document.querySelector("#worksheet-content").innerHTML = `
          <svg class="activity-drawing" viewBox="0 0 700 850" aria-hidden="true">
            ${numberedDiagram(1, stepOne())}
            ${numberedDiagram(2, stepTwo())}
            ${numberedDiagram(3, `<g data-fold-decoration="${next}">${stepThree(decoration[next])}</g>`)}
            ${foldingSteps.map(stepCaption).join("")}
            ${cutSquare()}
          </svg>`;
      }

      generateWorksheet();
    </script>
