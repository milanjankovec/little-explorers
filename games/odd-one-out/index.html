    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px;
        color: #20252d; background: #edf1f6;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
      .toolbar {
        display: flex; max-width: 900px;
        align-items: center; justify-content: space-between;
        gap: 16px; margin: 0 auto 24px;
      }
      .toolbar h1 { margin: 0 0 4px; font-size: 1.4rem; }
      .toolbar p { margin: 0; color: #566170; }
      .actions { display: flex; flex: 0 0 auto; gap: 8px; }
      button {
        padding: 11px 16px; border: 0; border-radius: 8px;
        color: white; background: #3158a5; font: inherit; font-weight: 650;
        cursor: pointer; transition: background 0.15s;
      }
      button:hover { background: #244485; }
      button.secondary {
        color: #263248; background: white;
        box-shadow: inset 0 0 0 1px #cbd3df;
      }
      button.secondary:hover { background: #f5f7fa; }
      .worksheet {
        width: min(100%, 210mm); height: 297mm;
        margin: 0 auto 24px; padding: 10mm 12mm;
        background: white; box-shadow: 0 2px 18px #1720331a;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .page-header {
        border-bottom: 0.4mm solid #d5dbe4;
        padding-bottom: 2mm; margin-bottom: 3mm;
        display: flex; justify-content: space-between; align-items: flex-end;
      }
      .page-header h1 { margin: 0; font-size: 16pt; color: #1e2633; }
      .page-header p { margin: 1mm 0 0; font-size: 9pt; color: #5d6878; }
      .rows-container {
        display: flex; flex-direction: column; gap: 4mm; flex: 1; justify-content: space-around;
      }
      .odd-row-card {
        border: 0.35mm solid #cbd3df; border-radius: 3mm;
        padding: 3mm 4mm; background: #fafbfd;
        display: flex; flex-direction: column; gap: 2.5mm;
      }
      .row-header {
        display: flex; justify-content: space-between; align-items: center;
      }
      .row-title { font-size: 10pt; font-weight: 700; color: #263248; }
      .badge {
        padding: 0.8mm 2mm; border: 0.25mm solid #454b54;
        border-radius: 999px; font-size: 7pt; font-weight: 600; color: #454b54;
      }
      .items-strip {
        display: flex; justify-content: space-around; align-items: center; gap: 3mm;
      }
      .item-box {
        flex: 1; aspect-ratio: 1; max-width: 32mm;
        background: white; border: 0.35mm solid #cbd5e1;
        border-radius: 2.5mm; display: grid; place-items: center;
        padding: 2.5mm;
      }
      .item-box svg { width: 100%; height: 100%; }
      @media screen and (max-width: 650px) {
        body { padding: 12px; }
        .toolbar { align-items: flex-start; flex-direction: column; }
        .actions { width: 100%; }
        .actions button { flex: 1; }
        .worksheet { height: auto; min-height: 297mm; padding: 6mm; }
      }
      .game-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 11px;
        width: min(100%, 210mm);
        margin-inline: auto;
        padding-block: 9px 5px;
        border-top: 1px solid #cbd3df;
        color: #4c5766;
        font-size: .65rem;
        line-height: 1.5;
      }

      .game-footer a {
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .game-footer a:hover { color: #3158a5; background: none; }

      @page { size: A4 portrait; margin: 0; }
      @media print {
        .odd-row-card { background-color: white; }
        body { padding: 0; background: white; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        .toolbar, .game-footer { display: none; }
        .worksheet {
          width: 210mm; height: 297mm; min-height: 297mm;
          margin: 0; padding: 10mm 12mm; box-shadow: none; page-break-after: avoid;
        }
      }
      .game-topbar {
        max-width: 900px;
        margin: 0 auto 12px;
        color: #394553;
        font: 600 .9rem/1.4 system-ui, sans-serif;
      }

      .game-brand-row, .game-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      .game-brand-row {
        min-height: 56px;
        padding-bottom: 9px;
        border-bottom: 1px solid #cbd9d0;
      }

      .game-links { position: relative; padding-top: 8px; }
      .game-topbar .site-brand, .game-topbar .catalog-link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        max-width: 100%;
        gap: 8px;
        color: #246547;
        text-decoration: none;
      }

      .game-topbar .site-brand { color: #202f26; font-size: 1.06rem; font-weight: 800; }
      .game-topbar .catalog-link { font-weight: 700; overflow-wrap: anywhere; }
      .game-topbar .catalog-link:hover, .game-topbar .site-brand:hover { text-decoration: underline; text-underline-offset: .2em; }
      .catalog-link svg { flex: none; }
      .game-brand-icon {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #dceedd;
        color: #236747;
        font-size: 1.25rem;
        line-height: 1;
      }

      .language-bar[hidden], .games-menu[hidden] { display: none; }
      .language-bar { margin-inline-start: auto; }
      .language-control { display: flex; align-items: center; gap: 7px; }
      .language-control select {
        max-width: min(145px, 42vw);
        padding: 5px 6px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .game-topbar :is(a, summary, select):focus-visible {
        outline: 2px solid #246547;
        outline-offset: 2px;
      }

      .games-menu { max-width: 100%; margin-inline-start: auto; }
      .games-menu summary {
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .games-menu-panel {
        position: absolute;
        z-index: 10;
        top: calc(100% + 6px);
        inset-inline-end: 0;
        width: min(480px, 100%);
        max-height: min(58vh, 470px);
        overflow: auto;
        padding: 8px;
        border: 1px solid #cbd3df;
        border-radius: 9px;
        background: #fff;
        box-shadow: 0 6px 22px #17203324;
      }

      .games-menu-panel ul {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .games-menu-panel a {
        display: block;
        padding: 5px 7px;
        border-radius: 5px;
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .games-menu-panel a:hover, .games-menu-panel a[aria-current="page"] { background: #e7f2e8; }

      @media screen and (max-width: 430px) {
        .games-menu-panel ul { grid-template-columns: 1fr; }
      }

      @media print { .game-topbar { display: none; } }
    </style>

e a que sobra e risque-a ou circule-a."],

        const column = codes.indexOf(language);

        function remember(code) {
          try { localStorage.setItem(preferenceKey, code); } catch {}
        }

        function localizedUrl(href, code) {
          const url = new URL(href, location.href);
          url.searchParams.set("lang", code);
          return url;
        }

        function translate(value) {
          if (language === "sk" || !value) return value;
          const key = value.trim().replace(/\s+/g, " ");
          const exact = (messages[key] ?? shared[key])?.[column];
          if (exact !== undefined) return exact;
          const numbered = key.match(/^(\d+\.\s+)(.+)$/u);
          if (numbered) return numbered[1] + translate(numbered[2]);
          const colon = key.indexOf(":");
          if (colon > 0) {
            const label = key.slice(0, colon);
            const tail = key.slice(colon + 1).trim();
            const translatedLabel = translate(label);
            const translatedTail = translate(tail);
            if (label !== translatedLabel || tail !== translatedTail) {
              return translatedLabel + ":" + (tail ? " " + translatedTail : "");
            }
          }
          if (key.includes(" | ")) return key.split(" | ").map(translate).join(" | ");
          if (key.includes(", ")) {
            const parts = key.split(", ");
            const translated = parts.map(translate).join(", ");
            if (translated !== key) return translated;
          }
          return value;
        }

        { id: "vegetables", title: "Zelenina", icons: ["carrot", "pepper", "peas", "cucumber", "tomato"] },
        { id: "vehicles", title: "Dopravné prostriedky", icons: ["car", "train", "bus", "boat", "plane", "bike", "tractor", "scooter"] },
        { id: "toys", title: "Hračky", icons: ["ball", "kite", "drum", "blocks", "doll", "puzzle", "yoyo"] },
        { id: "sky", title: "Na oblohe", icons: ["sun", "moon", "star", "cloud"] },
        { id: "plants", title: "Stromy, kvety a listy", icons: ["flower", "tree", "leaf"] }
      ];

      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function buildRow(category, intruder, answerPosition, index) {
        const items = shuffle(category.icons).slice(0, 3);
        items.splice(answerPosition, 0, intruder);

        let itemsHtml = "";
        items.forEach(icon => {
          itemsHtml += `
            <div class="item-box">
              <svg viewBox="0 0 64 64"><use href="#icon-${icon}"/></svg>
            </div>
          `;
        });

        const card = document.createElement("article");
        card.className = "odd-row-card";
        card.innerHTML = `
          <div class="row-header">
            <span class="row-title">${index + 1}. ${category.title}</span>
            <span class="badge">Nájdi 1 votrelca</span>
          </div>
          <div class="items-strip">
            ${itemsHtml}
          </div>
        `;
        return card;
      }

      function generateWorksheet() {
        const groups = shuffle(categories);
        const picked = groups.slice(0, 4);
        const outside = shuffle(groups.slice(4).flatMap(category => category.icons));
        const positions = shuffle([0, 1, 2, 3]);
        const container = document.querySelector("#rows");
        container.innerHTML = "";
        picked.forEach((category, index) => {
          const intruderIndex = outside.findIndex(icon => {
            // An aircraft, a kite or a flying animal can also belong in the sky.
            return category.id !== "sky" || !["plane", "kite", "bee", "duck"].includes(icon);
          });
          const [intruder] = outside.splice(intruderIndex, 1);
          container.appendChild(buildRow(category, intruder, positions[index], index));
        });
      }

      generateWorksheet();
    </script>
  </body>
</html>
