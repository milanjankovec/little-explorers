    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px;
        color: #20252d; background: #edf1f6;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .toolbar {
        display: flex; max-width: 900px;
        align-items: center; justify-content: space-between;
        gap: 16px; margin: 0 auto 24px;
      }
      .toolbar h1 { margin: 0 0 4px; font-size: 1.4rem; }
      .toolbar p { margin: 0; color: #566170; }
      .actions { display: flex; flex: 0 0 auto; gap: 8px; }
      button {
        padding: 11px 16px; border: 0; border-radius: 8px;
        color: white; background: #3158a5; font: inherit; font-weight: 650;
        cursor: pointer; transition: background 0.15s;
      }
      button:hover { background: #244485; }
      button.secondary {
        color: #263248; background: white;
        box-shadow: inset 0 0 0 1px #cbd3df;
      }
      button.secondary:hover { background: #f5f7fa; }
      .worksheet {
        width: min(100%, 210mm); height: 297mm;
        margin: 0 auto 24px; padding: 10mm 12mm;
        background: white; box-shadow: 0 2px 18px #1720331a;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .page-header {
        border-bottom: 0.4mm solid #d5dbe4;
        padding-bottom: 2mm; margin-bottom: 3mm;
        display: flex; justify-content: space-between; align-items: flex-end;
      }
      .page-header h1 { margin: 0; font-size: 16pt; color: #1e2633; }
      .page-header p { margin: 1mm 0 0; font-size: 9pt; color: #5d6878; }
      .cards-grid {
        display: grid; grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr; gap: 5mm; flex: 1;
      }
      .missing-card {
        border: 0.35mm solid #cbd3df; border-radius: 3mm;
        padding: 3mm 3.5mm; background: #fafbfd;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .card-header {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 1mm;
      }
      .card-header h2 { margin: 0; font-size: 11pt; color: #263248; }
      .badge {
        padding: 0.8mm 2mm; border: 0.25mm solid #454b54;
        border-radius: 999px; font-size: 7pt; font-weight: 600; color: #454b54;
      }
      .missing-svg { width: 100%; height: 58mm; display: block; }
      .choices-row {
        display: flex; justify-content: space-around; align-items: center;
        background: white; padding: 2mm 1mm; border-radius: 2mm;
        border: 0.3mm solid #cbd5e1; margin-top: 1.5mm;
      }
      .choice-bubble {
        padding: 1.5mm 3.5mm; border: 0.35mm solid #717d8e;
        border-radius: 999px; font-size: 8pt; font-weight: 700; color: #1e293b;
      }
      @media (max-width: 650px) {
        body { padding: 12px; }
        .toolbar { align-items: flex-start; flex-direction: column; }
        .actions { width: 100%; }
        .actions button { flex: 1; }
        .worksheet { height: auto; min-height: 297mm; padding: 6mm; }
        .cards-grid { grid-template-columns: 1fr; }
      }
      .game-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 11px;
        width: min(100%, 210mm);
        margin-inline: auto;
        padding-block: 9px 5px;
        border-top: 1px solid #cbd3df;
        color: #4c5766;
        font-size: .65rem;
        line-height: 1.5;
      }

      .game-footer a {
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .game-footer a:hover { color: #3158a5; background: none; }

      @page { size: A4 portrait; margin: 0; }
      @media print {
        .missing-card { background-color: white; }
        body { padding: 0; background: white; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        .toolbar, .game-footer { display: none; }
        .worksheet {
          width: 210mm; height: 297mm; min-height: 297mm;
          margin: 0; padding: 10mm 12mm; box-shadow: none; page-break-after: avoid;
        }
      }
      .game-topbar {
        max-width: 900px;
        margin: 0 auto 12px;
        color: #394553;
        font: 600 .9rem/1.4 system-ui, sans-serif;
      }

      .game-brand-row, .game-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      .game-brand-row {
        min-height: 56px;
        padding-bottom: 9px;
        border-bottom: 1px solid #cbd9d0;
      }

      .game-links { position: relative; padding-top: 8px; }
      .game-topbar .site-brand, .game-topbar .catalog-link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        max-width: 100%;
        gap: 8px;
        color: #246547;
        text-decoration: none;
      }

      .game-topbar .site-brand { color: #202f26; font-size: 1.06rem; font-weight: 800; }
      .game-topbar .catalog-link { font-weight: 700; overflow-wrap: anywhere; }
      .game-topbar .catalog-link:hover, .game-topbar .site-brand:hover { text-decoration: underline; text-underline-offset: .2em; }
      .catalog-link svg { flex: none; }
      .game-brand-icon {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #dceedd;
        color: #236747;
        font-size: 1.25rem;
        line-height: 1;
      }

      .language-bar[hidden], .games-menu[hidden] { display: none; }
      .language-bar { margin-inline-start: auto; }
      .language-control { display: flex; align-items: center; gap: 7px; }
      .language-control select {
        max-width: min(145px, 42vw);
        padding: 5px 6px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .game-topbar :is(a, summary, select):focus-visible {
        outline: 2px solid #246547;
        outline-offset: 2px;
      }

      .games-menu { max-width: 100%; margin-inline-start: auto; }
      .games-menu summary {
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .games-menu-panel {
        position: absolute;
        z-index: 10;
        top: calc(100% + 6px);
        inset-inline-end: 0;
        width: min(480px, 100%);
        max-height: min(58vh, 470px);
        overflow: auto;
        padding: 8px;
        border: 1px solid #cbd3df;
        border-radius: 9px;
        background: #fff;
        box-shadow: 0 6px 22px #17203324;
      }

      .games-menu-panel ul {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .games-menu-panel a {
        display: block;
        padding: 5px 7px;
        border-radius: 5px;
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .games-menu-panel a:hover, .games-menu-panel a[aria-current="page"] { background: #e7f2e8; }

      @media screen and (max-width: 430px) {
        .games-menu-panel ul { grid-template-columns: 1fr; }
      }

      @media print { .game-topbar { display: none; } }
    </style>

      function makeScene(template) {
        const missing = template.parts[Math.floor(Math.random() * template.parts.length)];
        const shown = template.parts.filter(part => part !== missing);
        const [cueX, cueY] = missing.cue;
        const visible = shown.map(part => `
          <path d="${part.path}" fill="${part.fill || "none"}" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        `).join("");
        return {
          title: template.title,
          answer: missing.answer,
          distractors: shown.map(part => part.answer),
          svg: `
            ${template.base}
            ${visible}
            <path d="${missing.path}" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="${cueX}" y="${cueY}" text-anchor="middle" font-size="17" font-weight="850" fill="#b91c1c">?</text>
          `
        };
      }

      function buildCard(item) {
        const choices = shuffle([item.answer, ...item.distractors]);

        let choicesHtml = "";
        choices.forEach(c => {
          choicesHtml += `<span class="choice-bubble">${c}</span>`;
        });

        const card = document.createElement("article");
        card.className = "missing-card";
        card.innerHTML = `
          <div class="card-header">
            <h2>${item.title}</h2>
            <span class="badge">Čo chýba?</span>
          </div>
          <svg class="missing-svg" viewBox="0 0 240 160">
            ${item.svg}
          </svg>
          <div class="choices-row">
            ${choicesHtml}
          </div>
        `;
        return card;
      }

      let lastScenes = [];
      function generateWorksheet() {
        const available = scenes.filter(scene => !lastScenes.includes(scene.id));
        const availableAssembled = assembledScenes.filter(scene => !lastScenes.includes(scene.id));
        const assembledCount = 1 + Math.floor(Math.random() * 3);
        const fixed = shuffle(available).slice(0, 4 - assembledCount);
        const assembled = shuffle(availableAssembled).slice(0, assembledCount);
        lastScenes = [...fixed, ...assembled].map(scene => scene.id);

        const grid = document.querySelector("#grid");
        grid.innerHTML = "";
        const cards = shuffle([...fixed, ...assembled.map(makeScene)]);
        cards.forEach(card => grid.appendChild(buildCard(card)));
      }

      generateWorksheet();
    </script>
