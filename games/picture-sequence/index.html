    <title>Čo bolo najprv? | Pracovný list</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 24px;
        color: #20252d;
        background: #edf1f6;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 900px;
        gap: 16px;
        margin: 0 auto 24px;
      }

      .toolbar h1 { margin: 0 0 4px; font-size: 1.4rem; }
      .toolbar p { margin: 0; color: #566170; }
      .actions { display: flex; gap: 8px; flex: 0 0 auto; }

      button {
        padding: 11px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #3158a5;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover { background: #244485; }

      button.secondary {
        color: #263248;
        background: white;
        box-shadow: inset 0 0 0 1px #cbd3df;
      }

      button.secondary:hover { background: #f5f7fa; }
      button:focus-visible { outline: 3px solid #3158a5; outline-offset: 2px; }

      .worksheet {
        width: min(100%, 210mm);
        min-height: 297mm;
        margin: 0 auto;
        padding: 10mm 12mm;
        background: white;
        box-shadow: 0 2px 18px #1720331a;
      }

      .page-header {
        padding-bottom: 2.5mm;
        margin-bottom: 3.5mm;
        border-bottom: 0.4mm solid #d5dbe4;
      }

      .page-header h2 { margin: 0; font-size: 16pt; }
      .page-header p { margin: 1mm 0 0; color: #465364; font-size: 10pt; }
      .stories { display: grid; gap: 3.5mm; }

      .story {
        padding: 2.5mm 3mm;
        border: 0.35mm solid #bcc5d0;
        border-radius: 3mm;
        break-inside: avoid;
      }

      .story h3 { margin: 0 0 1.5mm; font-size: 10pt; font-weight: 650; }
      .scenes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3mm; }
      .scene { margin: 0; text-align: center; }

      .scene > svg {
        display: block;
        width: 100%;
        height: 34mm;
        margin-bottom: 1.6mm;
        border: 0.25mm solid #d5dbe4;
        border-radius: 2mm;
        background: #fafbfd;
      }

      .answer-box {
        display: block;
        width: 13mm;
        height: 12mm;
        margin: 0 auto;
        border: 0.45mm solid #59677b;
        border-radius: 1.5mm;
      }

      @media screen and (max-width: 650px) {
        body { padding: 12px; }
        .toolbar { flex-direction: column; align-items: stretch; }
        .actions { flex-wrap: wrap; }
        .actions button { flex: 1 1 auto; }
        .worksheet { min-height: 0; padding: 4mm; }
        .story { padding: 2mm; }
        .scenes { gap: 1.5mm; }
        .scene > svg { height: auto; aspect-ratio: 140 / 88; }
        .answer-box { width: 11mm; height: 10mm; }
      }

      .game-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 11px;
        width: min(100%, 210mm);
        margin-inline: auto;
        padding-block: 9px 5px;
        border-top: 1px solid #cbd3df;
        color: #4c5766;
        font-size: .65rem;
        line-height: 1.5;
      }

      .game-footer a {
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .game-footer a:hover { color: #3158a5; background: none; }

      @page { size: A4 portrait; margin: 0; }

      @media print {
        .scene > svg { background-color: white; }
        body {
          padding: 0;
          background: white;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .toolbar, .game-footer { display: none; }

        .worksheet {
          width: 210mm;
          min-height: 0;
          margin: 0;
          padding: 10mm 12mm;
          box-shadow: none;
        }
      }
      .game-topbar {
        max-width: 900px;
        margin: 0 auto 12px;
        color: #394553;
        font: 600 .9rem/1.4 system-ui, sans-serif;
      }

      .game-brand-row, .game-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      .game-brand-row {
        min-height: 56px;
        padding-bottom: 9px;
        border-bottom: 1px solid #cbd9d0;
      }

      .game-links { position: relative; padding-top: 8px; }
      .game-topbar .site-brand, .game-topbar .catalog-link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        max-width: 100%;
        gap: 8px;
        color: #246547;
        text-decoration: none;
      }

      .game-topbar .site-brand { color: #202f26; font-size: 1.06rem; font-weight: 800; }
      .game-topbar .catalog-link { font-weight: 700; overflow-wrap: anywhere; }
      .game-topbar .catalog-link:hover, .game-topbar .site-brand:hover { text-decoration: underline; text-underline-offset: .2em; }
      .catalog-link svg { flex: none; }
      .game-brand-icon {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #dceedd;
        color: #236747;
        font-size: 1.25rem;
        line-height: 1;
      }

      .language-bar[hidden], .games-menu[hidden] { display: none; }
      .language-bar { margin-inline-start: auto; }
      .language-control { display: flex; align-items: center; gap: 7px; }
      .language-control select {
        max-width: min(145px, 42vw);
        padding: 5px 6px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .game-topbar :is(a, summary, select):focus-visible {
        outline: 2px solid #246547;
        outline-offset: 2px;
      }

      .games-menu { max-width: 100%; margin-inline-start: auto; }
      .games-menu summary {
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .games-menu-panel {
        position: absolute;
        z-index: 10;
        top: calc(100% + 6px);
        inset-inline-end: 0;
        width: min(480px, 100%);
        max-height: min(58vh, 470px);
        overflow: auto;
        padding: 8px;
        border: 1px solid #cbd3df;
        border-radius: 9px;
        background: #fff;
        box-shadow: 0 6px 22px #17203324;
      }

      .games-menu-panel ul {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .games-menu-panel a {
        display: block;
        padding: 5px 7px;
        border-radius: 5px;
        color: inherit;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .games-menu-panel a:hover, .games-menu-panel a[aria-current="page"] { background: #e7f2e8; }

      @media screen and (max-width: 430px) {
        .games-menu-panel ul { grid-template-columns: 1fr; }
      }

      @media print { .game-topbar { display: none; } }
    </style>

      "Čo bolo najprv?": ["What happened first?","Co bylo nejdřív?","Was kam zuerst?","Co było najpierw?","Mi történt először?","Qu’est-il arrivé en premier ?","¿Qué pasó primero?","Cosa è successo per primo?","O que aconteceu primeiro?","Wat gebeurde eerst?","Ce s-a întâmplat mai întâi?","Що було спочатку?","Τι έγινε πρώτα;","Vad hände först?","什么先发生？","什麼先發生？","はじめに何が起きた？","무엇이 먼저였을까요?","Apa yang terjadi dulu?","Önce ne oldu?","Chuyện gì xảy ra trước?","O que aconteceu primeiro?"],
      "Zoraď tri obrázky, aby z nich vznikol príbeh.": ["Put the three pictures in order to tell a story.","Seřaď tři obrázky tak, aby z nich vznikl příběh.","Ordne die drei Bilder so, dass sie eine Geschichte erzählen.","Ułóż trzy obrazki w kolejności, aby powstała historyjka.","Rakd sorba a három képet, hogy történetet meséljenek el.","Mets les trois images dans l’ordre pour raconter une histoire.","Ordena los tres dibujos para contar una historia.","Metti in ordine le tre figure per raccontare una storia.","Põe as três imagens por ordem para contar uma história.","Zet de drie plaatjes in de juiste volgorde om een verhaal te vertellen.","Pune cele trei imagini în ordine ca să formeze o poveste.","Розташуй три малюнки по порядку, щоб вийшла історія.","Βάλε τις τρεις εικόνες στη σειρά για να διηγηθείς μια ιστορία.","Lägg de tre bilderna i ordning så att de berättar en historia.","把三幅图排成一个故事。","把三幅圖排成一個故事。","3つの絵をお話の順番に並べよう。","그림 세 장을 순서대로 놓아 이야기를 만들어요.","Urutkan tiga gambar untuk membuat cerita.","Bir hikâye anlatmak için üç resmi sıraya koy.","Xếp ba hình theo thứ tự để kể một câu chuyện.","Coloque as três imagens em ordem para contar uma história."],
      "Nové príbehy": ["New stories","Nové příběhy","Neue Geschichten","Nowe historyjki","Új történetek","Nouvelles histoires","Nuevas historias","Nuove storie","Novas histórias","Nieuwe verhalen","Povești noi","Нові історії","Νέες ιστορίες","Nya berättelser","换一组故事","換一組故事","新しいお話","새 이야기","Cerita baru","Yeni hikâyeler","Câu chuyện mới","Novas histórias"],
      "Pod prvý obrázok v príbehu napíš 1, pod druhý 2 a pod posledný 3.": ["Write 1 under the first picture in the story, 2 under the second and 3 under the last.","Pod první obrázek v příběhu napiš 1, pod druhý 2 a pod poslední 3.","Schreibe unter das erste Bild der Geschichte eine 1, unter das zweite eine 2 und unter das letzte eine 3.","Pod pierwszym obrazkiem w historyjce napisz 1, pod drugim 2, a pod ostatnim 3.","Írj 1-et a történet első képe alá, 2-t a második és 3-at az utolsó alá.","Écris 1 sous la première image de l’histoire, 2 sous la deuxième et 3 sous la dernière.","Escribe 1 bajo el primer dibujo de la historia, 2 bajo el segundo y 3 bajo el último.","Scrivi 1 sotto la prima immagine della storia, 2 sotto la seconda e 3 sotto l’ultima.","Escreve 1 por baixo da primeira imagem da história, 2 por baixo da segunda e 3 por baixo da última.","Schrijf 1 onder het eerste plaatje van het verhaal, 2 onder het tweede en 3 onder het laatste.","Scrie 1 sub prima imagine a poveștii, 2 sub a doua și 3 sub ultima.","Напиши 1 під першим малюнком історії, 2 під другим і 3 під останнім.","Γράψε 1 κάτω από την πρώτη εικόνα της ιστορίας, 2 κάτω από τη δεύτερη και 3 κάτω από την τελευταία.","Skriv 1 under den första bilden i berättelsen, 2 under den andra och 3 under den sista.","在故事第一幅图下写 1，第二幅图下写 2，最后一幅图下写 3。","在故事第一幅圖下寫 1，第二幅圖下寫 2，最後一幅圖下寫 3。","お話の最初の絵の下に1、次の絵の下に2、最後の絵の下に3を書こう。","이야기의 첫 그림 아래에 1, 다음 그림 아래에 2, 마지막 그림 아래에 3을 써요.","Tulis 1 di bawah gambar pertama, 2 di bawah gambar kedua, dan 3 di bawah gambar terakhir.","Hikâyenin ilk resminin altına 1, ikincisinin altına 2, sonuncusunun altına 3 yaz.","Viết số 1 dưới hình đầu tiên trong câu chuyện, số 2 dưới hình thứ hai và số 3 dưới hình cuối.","Escreva 1 embaixo da primeira imagem da história, 2 embaixo da segunda e 3 embaixo da última."],

        const column = codes.indexOf(language);

        function remember(code) {
          try { localStorage.setItem(preferenceKey, code); } catch {}
        }

        function localizedUrl(href, code) {
          const url = new URL(href, location.href);
          url.searchParams.set("lang", code);
          return url;
        }

        function translate(value) {
          if (language === "sk" || !value) return value;
          const key = value.trim().replace(/\s+/g, " ");
          const exact = (messages[key] ?? shared[key])?.[column];
          if (exact !== undefined) return exact;
          const numbered = key.match(/^(\d+\.\s+)(.+)$/u);
          if (numbered) return numbered[1] + translate(numbered[2]);
          const colon = key.indexOf(":");
          if (colon > 0) {
            const label = key.slice(0, colon);
            const tail = key.slice(colon + 1).trim();
            const translatedLabel = translate(label);
            const translatedTail = translate(tail);
            if (label !== translatedLabel || tail !== translatedTail) {
              return translatedLabel + ":" + (tail ? " " + translatedTail : "");
            }
          }
          if (key.includes(" | ")) return key.split(" | ").map(translate).join(" | ");
          if (key.includes(", ")) {
            const parts = key.split(", ");
            const translated = parts.map(translate).join(", ");
            if (translated !== key) return translated;
          }
          return value;
        }

      const mixedOrders = [
        [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]
      ];

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const other = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[other]] = [copy[other], copy[i]];
        }
        return copy;
      }

      function generateWorksheet() {
        const selection = shuffle(stories).slice(0, 4);
        const orders = shuffle(mixedOrders);
        document.getElementById("stories").innerHTML = selection.map((story, row) => `
          <section class="story">
            <h3>${row + 1}. ${story.title}</h3>
            <div class="scenes">
              ${orders[row].map(stageIndex => {
                const [label, picture] = story.stages[stageIndex];
                return `
                  <figure class="scene">
                    <svg viewBox="0 0 140 88" role="img" aria-label="${label}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      ${picture}
                    </svg>
                    <span class="answer-box" aria-hidden="true"></span>
                  </figure>
                `;
              }).join("")}
            </div>
          </section>
        `).join("");
      }

      generateWorksheet();
    </script>
